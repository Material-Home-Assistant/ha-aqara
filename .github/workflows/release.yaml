name: 🧩 Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Prepare Release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Zip the integration
        run: |
          cd custom_components/ha_aqara
          zip -r ../../ha-aqara.zip . -x "**/__pycache__/*"

      - name: 🚀 Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} ./ha-aqara.zip --clobber
