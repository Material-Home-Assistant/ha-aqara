name: "🚀 Feature Request (Aqara G100)"
description: "Suggest a new entity, RID, or enhancement for the Aqara Camera G100 integration!"
title: "[FEATURE]: "
labels: ["enhancement"]
assignees:
  - "giovannilamarmora"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your contribution! We appreciate new ideas to improve the integration. 🙌

  - type: textarea
    id: related-problem
    attributes:
      label: "🤔 What feature or camera control would you like to add?"
      description: "Describe the limitation or missing entity/service."
      placeholder: "I would like to expose..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "✨ Describe the solution you'd like"
      description: "Include any Aqara RID / Trait / diagnostic output if known."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "🖼️ Additional Context"
      description: "Add any other context, firmware version, or screenshots."
